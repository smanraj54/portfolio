<?xml version="1.0" encoding="UTF-8"?>
<!--
  The tab mark. Same "MS" monogram and same gradient stops as portrait.svg —
  they are one identity and have to be edited together.

  Three deliberate differences from the on-page version, all of them because
  this renders at 16–32 CSS pixels:

  - The tile is full bleed, rx 112. The 52-unit transparent gutter that carries
    portrait.svg's bloom would cost ~20% of the icon's width here, which at 16px
    is the difference between a readable monogram and a smudge.
  - No feGaussianBlur anywhere. A bloom that reads as light at 132px reads as
    dedicated anti-aliasing at 16px, and it softens the one edge that has to
    stay sharp.
  - The mark is scaled to 0.95 rather than 0.742, so the strokes land near 1.6px
    at 16px and ~3px at 32px.

  SVG only, and there is still no favicon.ico beside it — see the note in
  web/index.html for why a link to a file that does not exist is worse here than
  no link at all.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="Monogram: M S"
>
  <defs>
    <linearGradient id="ramp" gradientUnits="userSpaceOnUse" x1="36" y1="120" x2="476" y2="392">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.42" stop-color="#7c5cff" />
      <stop offset="0.72" stop-color="#c64be8" />
      <stop offset="1" stop-color="#ff4d7e" />
    </linearGradient>

    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#232327" />
      <stop offset="0.55" stop-color="#16161a" />
      <stop offset="1" stop-color="#0b0b0d" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)" />

  <!-- Rim light, inset by half its stroke. 7 units is ~0.2px at 16px: it does
       not read as a line there, it reads as the tile's edge not being pure
       black against a dark browser chrome, which is the point. -->
  <rect
    x="3.5"
    y="3.5"
    width="505"
    height="505"
    rx="108.5"
    fill="none"
    stroke="url(#ramp)"
    stroke-width="7"
  />

  <g transform="translate(256 256) scale(0.95) translate(-256 -256)">
    <!-- `stroke-miterlimit="1"` chamfers the M's shoulders rather than letting
         them spike ~94 units above the stem, which would make the M stand
         taller than the S and the mark read as "Ms". See portrait.svg. -->
    <g
      fill="none"
      stroke="url(#ramp)"
      stroke-width="52"
      stroke-linecap="butt"
      stroke-linejoin="miter"
      stroke-miterlimit="1"
    >
      <path d="M80 388V150l85 140 85-140v238" />
      <path
        d="M432 200Q432 150 370 150Q308 150 308 202Q308 246 370 256Q432 266 432 310Q432 362 370 362Q308 362 308 312"
      />
    </g>
  </g>
</svg>
