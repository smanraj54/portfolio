<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monogram stand-in for the profile photograph.

  Referenced as `profile.photo`, so swapping in a real portrait is one string in
  web/src/content/profile.ts. It is a monogram rather than a "no image" glyph so
  that the page never looks broken if the photo ships late — an initials avatar
  is a legitimate final state, not a placeholder artefact.

  Fonts are named with a system fallback chain: an SVG loaded through <img> is a
  separate document and cannot use the page's @font-face rules.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="Monogram: M S"
>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202020" />
      <stop offset="1" stop-color="#0c0c0c" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd3e7" />
      <stop offset="1" stop-color="#f0b95a" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#surface)" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ink)" stroke-width="3" opacity="0.55" />

  <text
    x="256"
    y="256"
    fill="#eeeeee"
    font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="190"
    font-weight="600"
    letter-spacing="-6"
    text-anchor="middle"
    dominant-baseline="central"
  >MS</text>
</svg>
