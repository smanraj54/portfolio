<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      No-flash theme resolution (§4.3). Must run before any stylesheet so the
      first paint is already in the right palette. Inline and synchronous on
      purpose: an external or deferred script would repaint.

      The reference template masked the repaint with a full-screen spinner on
      every theme change; with CSS custom properties there is nothing to mask.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored !== 'light' && stored !== 'dark') {
            stored = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
          }
          document.documentElement.dataset.theme = stored
        } catch (e) {
          // Private browsing can throw on localStorage access. Dark is the default.
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>

    <title>Manraj Singh — Senior Software Engineer</title>
    <meta
      name="description"
      content="Senior Software Engineer with 7+ years building backend and distributed systems, including 3.5 years at Amazon. Cloud architecture on AWS, real-time protocol design, and retrieval-augmented generation."
    />
    <meta name="author" content="Manraj Singh" />

    <!--
      Absolute URLs below must match VITE_SITE_ORIGIN in web/.env — index.html
      cannot read import.meta.env. A test asserts the two agree.
    -->
    <link rel="canonical" href="https://manrajsingh.ca/" />

    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#edf1f3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!--
      SVG only, deliberately. There is no favicon.ico / apple-touch-icon.png /
      site.webmanifest in web/public, and CloudFront rewrites 403 and 404 to
      /index.html with a 200 — so a reference to a file that does not exist
      resolves to an HTML document rather than failing. The security headers
      policy sends X-Content-Type-Options: nosniff, so nothing can recover from
      that: the icon silently does not render and the manifest raises a parse
      error. Add the file before adding the link back.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Body face only. The display and mono faces are not on the LCP path. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manraj Singh" />
    <meta property="og:title" content="Manraj Singh — Senior Software Engineer" />
    <meta
      property="og:description"
      content="Backend and distributed systems, including 3.5 years at Amazon. Cloud architecture on AWS, real-time protocol design, and retrieval-augmented generation."
    />
    <meta property="og:url" content="https://manrajsingh.ca/" />
    <!--
      No og:image: /og-image.png does not exist, and promising one that answers
      200 text/html is worse than promising none — crawlers cache the failure.
      Add web/public/og-image.png (1200×630), then restore the og:image,
      og:image:width, og:image:height and og:image:alt metas and switch
      twitter:card back to summary_large_image.
    -->
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Manraj Singh — Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="Backend and distributed systems, including 3.5 years at Amazon. Cloud architecture on AWS, real-time protocol design, and retrieval-augmented generation."
    />
